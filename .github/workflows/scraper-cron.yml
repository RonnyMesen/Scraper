name: Weekly Costa Rica Scraper
on:
  schedule:
    - cron: '0 3 * * 3' 
  workflow_dispatch: 

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Generate Credentials File
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          
      - name: Run Scraper Pipeline
        run: python main.py
